name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon (arm64) — the sanctuary Mac's platform.
        os: [ubuntu-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node -p "process.platform + ' ' + process.arch"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
