name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is the primary deployment (the sanctuary PC runs Windows 11 + ETCnomad).
        # macos-latest runs on Apple Silicon (arm64), the secondary Mac deployment.
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node -p "process.platform + ' ' + process.arch"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: macOS deployment smoke test
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for f in deploy/macos/*.sh; do /bin/bash -n "$f"; done
          /bin/bash --version | head -1   # macOS ships bash 3.2; the installer must work with it
          /bin/bash deploy/macos/install.sh --dry-run
          /bin/bash deploy/macos/install.sh --dry-run --lan
          /bin/bash deploy/macos/check-mac.sh   # read-only diagnostics must run cleanly on stock macOS
          node deploy/macos/launchagent.mjs --node "$(command -v node)" --repo "$PWD" > "$RUNNER_TEMP/agent.plist"
          plutil -lint "$RUNNER_TEMP/agent.plist"
          # Start the real server the way launchd would and check it comes up offline.
          SANCTUARY_DATA_DIR="$RUNNER_TEMP/data" SANCTUARY_PREVENT_SLEEP=system NODE_ENV=production PORT=4799 \
            node node_modules/tsx/dist/cli.mjs server/src/index.ts > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4799/api/health > "$RUNNER_TEMP/health.json" 2>/dev/null && break; sleep 1; done
          cat "$RUNNER_TEMP/health.json"
          grep -q '"mode":"offline"' "$RUNNER_TEMP/health.json"
          grep -q '"platform":"darwin-arm64"' "$RUNNER_TEMP/health.json"
          curl -fsS http://127.0.0.1:4799/ > "$RUNNER_TEMP/index.html"
          grep -q '<div id="root">' "$RUNNER_TEMP/index.html"
          kill "$SERVER_PID"
          cat "$RUNNER_TEMP/server.log"
          ls "$RUNNER_TEMP/data/backups" | grep -q '^daily-'
      - name: Windows deployment smoke test
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1: what the sanctuary PC runs the scripts with.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # 1. Every script parses, and stays ASCII (5.1 reads BOM-less files as ANSI).
          foreach ($f in Get-ChildItem deploy\windows\*.ps1) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "$($f.Name): $_" }; throw "parse errors in $($f.Name)" }
            if ([System.IO.File]::ReadAllBytes($f.FullName) | Where-Object { $_ -gt 127 }) { throw "$($f.Name) contains non-ASCII characters" }
          }
          # 2. The installer's checks and scheduled-task definition (changes nothing).
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\install.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 -DryRun failed' }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\install.ps1 -DryRun -Lan -Kiosk -OpenAtLogin
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 -DryRun -Lan failed' }
          # 3. Start the real supervisor the way the scheduled task does.
          . .\deploy\windows\common.ps1
          function Show-Logs { foreach ($f in 'supervisor.log', 'server.log', 'server-errors.log', 'server.prev.log', 'server-errors.prev.log') { $p = Join-Path $script:LogDir $f; if (Test-Path $p) { Write-Host "--- $f"; Get-Content $p -Tail 40 } } }
          $node = (Get-Command node.exe).Source
          $sup = Start-Process powershell.exe -PassThru -WindowStyle Hidden -ArgumentList @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'deploy\windows\run-server.ps1', '-Node', "`"$node`"", '-Port', '4799', '-RestartDelaySeconds', '2')
          $h = $null; for ($i = 0; $i -lt 60 -and -not $h; $i++) { Start-Sleep 1; $h = Get-Health 4799 }
          if (-not $h) { Show-Logs; throw 'server did not start' }
          $h | ConvertTo-Json -Compress
          if ($h.mode -ne 'offline') { throw "expected offline, got $($h.mode)" }
          if ($h.platform -ne 'win32-x64') { throw "expected win32-x64, got $($h.platform)" }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4799/).Content -notmatch '<div id="root">') { throw 'interface not served' }
          $listen = @(Get-NetTCPConnection -State Listen -LocalPort 4799 | Select-Object -ExpandProperty LocalAddress -Unique)
          if ($listen -ne '127.0.0.1') { throw "expected 127.0.0.1 only, got $($listen -join ',')" }
          # 4. Crash recovery: kill the server; the supervisor must bring it back, still offline.
          $before = @(Get-SanctuaryServerProcesses)
          if ($before.Count -ne 1) { throw "expected 1 server process, found $($before.Count)" }
          Stop-Process -Id $before[0].ProcessId -Force
          Start-Sleep 3
          $h = $null; for ($i = 0; $i -lt 60 -and -not $h; $i++) { Start-Sleep 1; $h = Get-Health 4799 }
          if (-not $h) { Show-Logs; throw 'server did not come back after a crash' }
          $after = @(Get-SanctuaryServerProcesses)
          if ($after[0].ProcessId -eq $before[0].ProcessId) { throw 'server was not restarted' }
          if ($h.mode -ne 'offline') { throw "after restart expected offline, got $($h.mode)" }
          if (-not (Select-String -Path "$($script:LogDir)\supervisor.log" -Pattern 'restarting in' -Quiet)) { Show-Logs; throw 'supervisor did not log the restart' }
          # 4b. The documented restart test stops only Sanctuary Light's server, never another node.exe.
          $decoyDir = Join-Path $env:RUNNER_TEMP 'decoy'; New-Item -ItemType Directory -Force $decoyDir | Out-Null
          $decoy = Start-Process node.exe -PassThru -WindowStyle Hidden -WorkingDirectory $decoyDir -ArgumentList @('-e', '"setInterval(()=>{},1000)"')
          $beforeTest = @(Get-SanctuaryServerProcesses)[0].ProcessId
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\restart-test.ps1 -Port 4799
          if ($LASTEXITCODE -ne 0) { Show-Logs; throw 'restart-test.ps1 failed' }
          if (@(Get-SanctuaryServerProcesses)[0].ProcessId -eq $beforeTest) { throw 'restart-test.ps1 did not restart the server' }
          if (-not (Get-Process -Id $decoy.Id -ErrorAction SilentlyContinue)) { throw 'restart-test.ps1 stopped another node.exe' }
          Stop-Process -Id $decoy.Id
          # 5. The read-only check runs cleanly against the running server.
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\check-windows.ps1
          if ($LASTEXITCODE -ne 0) { throw 'check-windows.ps1 failed' }
          # 6. Clean up; daily backup was written to %LOCALAPPDATA%.
          # Stopping (as update/restore/install do) must free the processes, files and port.
          Stop-Process -Id $sup.Id -Force
          Stop-SanctuaryServer 4799
          if (@(Get-SanctuaryServerProcesses).Count -or @(Get-RepoHelperProcesses).Count) { throw 'server or esbuild still running after Stop-SanctuaryServer' }
          if (@(Get-NetTCPConnection -State Listen -LocalPort 4799 -ErrorAction SilentlyContinue).Count) { throw 'port 4799 still in use' }
          if (-not (Get-ChildItem "$($script:DataDir)\backups" -Filter 'daily-*')) { throw 'no daily backup' }
          Show-Logs
      - name: Windows install and uninstall (real), leaving other programs alone
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\deploy\windows\common.ps1
          # A stand-in for another program on the PC (like Eos): a node.exe outside this folder.
          $tmp = Join-Path $env:RUNNER_TEMP 'other-app'; New-Item -ItemType Directory -Force $tmp | Out-Null
          $other = Start-Process node.exe -PassThru -WindowStyle Hidden -WorkingDirectory $tmp -ArgumentList @('-e', '"setInterval(()=>{},1000)"')
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\install.ps1 -SkipTests -Port 4798
          if ($LASTEXITCODE -ne 0) { throw 'install.ps1 failed' }
          if (-not (Get-ScheduledTask -TaskName $script:TaskName -ErrorAction SilentlyContinue)) { throw 'scheduled task was not created' }
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Sanctuary Light.lnk'
          if (-not (Test-Path $desk)) { throw 'desktop shortcut was not created' }
          # The task may not start on a CI runner (no interactive sign-in); when it does, it must be offline.
          $h = Get-Health 4798
          if ($h) { if ($h.mode -ne 'offline') { throw "expected offline after install, got $($h.mode)" } else { Write-Host 'Installed and running in offline mode.' } }
          else { Write-Host 'Task registered; it did not start in this CI session (no interactive sign-in).' }
          if (-not (Get-Process -Id $other.Id -ErrorAction SilentlyContinue)) { throw 'install stopped another program' }
          # Uninstall: the dry run changes nothing; the real one removes only what the installer added.
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\uninstall.ps1 -DryRun
          if (-not (Get-ScheduledTask -TaskName $script:TaskName -ErrorAction SilentlyContinue)) { throw 'uninstall -DryRun removed the task' }
          powershell -NoProfile -ExecutionPolicy Bypass -File deploy\windows\uninstall.ps1 -Yes
          if (Get-ScheduledTask -TaskName $script:TaskName -ErrorAction SilentlyContinue) { throw 'task still installed after uninstall' }
          if (Test-Path $desk) { throw 'desktop shortcut still present after uninstall' }
          if (Get-Health 4798) { throw 'server still answering after uninstall' }
          if (-not (Test-Path (Join-Path $script:DataDir 'config.json'))) { throw 'uninstall deleted the settings' }
          if (-not (Get-Process -Id $other.Id -ErrorAction SilentlyContinue)) { throw 'uninstall stopped another program' }
          Stop-Process -Id $other.Id
